<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — 채팅</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

  <!-- Full height chat container -->
  <div id="chatContainer" class="flex flex-col h-screen max-w-3xl mx-auto bg-white shadow-sm">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 shrink-0 sticky top-0 z-10">
      <!-- Hamburger -->
      <button id="hamburgerBtn" class="md:hidden p-1.5 rounded-lg hover:bg-gray-100 text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <a href="/kanban.html" class="text-indigo-600 hover:text-indigo-800 font-medium text-sm">
        ← 칸반
      </a>
      <div class="flex-1">
        <h1 class="font-bold text-gray-800" id="chatTeamName">팀 채팅</h1>
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 bg-green-400 rounded-full"></span>
          <span class="text-xs text-gray-500" id="memberCount">0명</span>
        </div>
      </div>
      <button id="membersToggleBtn" class="hidden md:block text-sm text-gray-500 hover:text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-100">
        멤버
      </button>
    </header>

    <!-- Body: messages + optional members sidebar -->
    <div class="flex flex-1 min-h-0">

      <!-- Messages area -->
      <div class="flex-1 flex flex-col min-h-0">
        <!-- Messages scroll container -->
        <div
          id="messagesContainer"
          class="flex-1 overflow-y-auto px-4 py-4 space-y-1"
        >
          <!-- Messages rendered here by JS -->
          <div class="flex items-center justify-center py-8">
            <p class="text-gray-400 text-sm">메시지를 불러오는 중...</p>
          </div>
        </div>

        <!-- Input area -->
        <div class="border-t border-gray-200 px-4 py-3 bg-white shrink-0">
          <form id="sendForm" class="flex flex-col gap-1">
            <div class="flex gap-2 items-end">
              <input
                type="text"
                id="messageInput"
                maxlength="1000"
                placeholder="메시지 입력... (Enter로 전송)"
                class="flex-1 border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
                autocomplete="off"
              />
              <button
                type="submit"
                id="sendBtn"
                disabled
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2.5 rounded-xl transition-colors text-sm disabled:opacity-40 disabled:cursor-not-allowed shrink-0"
              >
                전송
              </button>
            </div>
            <div class="flex justify-end">
              <span id="charCounter" class="text-xs text-gray-400">0/1000</span>
            </div>
          </form>
        </div>
      </div>

      <!-- Members sidebar (desktop) -->
      <aside id="membersSidebar" class="hidden w-48 border-l border-gray-200 p-4 shrink-0 overflow-y-auto">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">팀원</p>
        <div id="chatMembersPanel" class="space-y-2"></div>
        <div class="mt-4 pt-4 border-t border-gray-100 space-y-2">
          <button id="logoutBtn" class="w-full text-left text-sm text-gray-500 hover:text-gray-800 py-1 rounded hover:bg-gray-50">로그아웃</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Mobile sidebar overlay -->
  <div id="mobileSidebar" class="fixed inset-0 z-50 hidden">
    <div id="sidebarBackdrop" class="absolute inset-0 bg-black/40"></div>
    <div class="absolute right-0 top-0 h-full w-64 bg-white shadow-xl p-5 flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-gray-800">팀원</h2>
        <button id="closeSidebarBtn" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>
      <div id="chatMembersMobile" class="space-y-2 flex-1"></div>
      <div class="mt-4 pt-4 border-t border-gray-100 space-y-2">
        <a href="/kanban.html" class="block text-sm text-indigo-600 font-medium py-1.5">칸반 보드</a>
        <button id="logoutBtnMobile" class="w-full text-left text-sm text-gray-500 py-1.5">로그아웃</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initChat, stopPolling } from './js/chat.js';
    import auth from './js/auth.js';
    import api from './js/api.js';
    import { showError } from './js/toast.js';

    if (!auth.requireAuth()) {
      // Will redirect
    }

    const user = auth.getUser();

    // Load team info and members
    async function loadTeamInfo() {
      if (!user || !user.team_id) return;
      try {
        const [team, members] = await Promise.all([
          api.get(`/teams/${user.team_id}`),
          api.get(`/teams/${user.team_id}/members`),
        ]);

        document.getElementById('chatTeamName').textContent = team.name;
        document.getElementById('memberCount').textContent = `${members.length}명`;

        // Render members panels
        function renderMemberItem(m) {
          const div = document.createElement('div');
          div.className = 'flex items-center gap-2';
          div.innerHTML = `
            <div class="w-7 h-7 rounded-full bg-indigo-100 flex items-center justify-center text-xs font-bold text-indigo-700 shrink-0">
              ${m.email[0].toUpperCase()}
            </div>
            <div class="min-w-0">
              <p class="text-sm font-medium text-gray-800 truncate">
                ${m.role === 'owner' ? '★ ' : ''}${m.email.split('@')[0]}
              </p>
              <p class="text-xs text-gray-400 truncate">${m.email}</p>
            </div>
          `;
          return div;
        }

        const desktopPanel = document.getElementById('chatMembersPanel');
        const mobilePanel = document.getElementById('chatMembersMobile');
        members.forEach(m => {
          desktopPanel.appendChild(renderMemberItem(m));
          mobilePanel.appendChild(renderMemberItem(m));
        });
      } catch (err) {
        showError(err.message);
      }
    }

    await loadTeamInfo();
    await initChat();

    // Members toggle (desktop)
    document.getElementById('membersToggleBtn')?.addEventListener('click', () => {
      const sidebar = document.getElementById('membersSidebar');
      sidebar.classList.toggle('hidden');
    });

    // Hamburger (mobile)
    document.getElementById('hamburgerBtn')?.addEventListener('click', () => {
      document.getElementById('mobileSidebar').classList.remove('hidden');
      document.getElementById('mobileSidebar').classList.add('flex');
    });
    document.getElementById('closeSidebarBtn')?.addEventListener('click', () => {
      document.getElementById('mobileSidebar').classList.add('hidden');
      document.getElementById('mobileSidebar').classList.remove('flex');
    });
    document.getElementById('sidebarBackdrop')?.addEventListener('click', () => {
      document.getElementById('mobileSidebar').classList.add('hidden');
      document.getElementById('mobileSidebar').classList.remove('flex');
    });

    // Logout
    async function handleLogout() {
      stopPolling();
      try { await api.post('/auth/logout', {}); } catch {}
      auth.clearAuth();
      window.location.href = '/index.html';
    }
    document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);
    document.getElementById('logoutBtnMobile')?.addEventListener('click', handleLogout);

    // Clean up on page leave
    window.addEventListener('beforeunload', stopPolling);
  </script>
</body>
</html>
