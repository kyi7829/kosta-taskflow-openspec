<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — 칸반 보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <!-- Hamburger (mobile) -->
      <button id="hamburgerBtn" class="md:hidden p-1.5 rounded-lg hover:bg-gray-100 text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h1 class="font-bold text-lg text-indigo-700">TaskFlow</h1>
      <span id="teamName" class="text-gray-600 text-sm font-medium hidden md:inline"></span>
    </div>

    <div class="flex items-center gap-2">
      <!-- Filter buttons -->
      <div class="hidden md:flex gap-1">
        <button data-filter="all" class="bg-indigo-600 text-white text-xs font-medium px-3 py-1.5 rounded-full transition-colors">전체</button>
        <button data-filter="me" class="bg-gray-100 text-gray-700 text-xs font-medium px-3 py-1.5 rounded-full transition-colors">@나</button>
        <button data-filter="unassigned" class="bg-gray-100 text-gray-700 text-xs font-medium px-3 py-1.5 rounded-full transition-colors">미할당</button>
      </div>

      <!-- Chat link -->
      <a href="/chat.html" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium px-3 py-1.5 rounded-lg hover:bg-indigo-50 transition-colors">
        💬 채팅
      </a>
    </div>
  </header>

  <!-- Mobile filter + tab indicator -->
  <div class="md:hidden flex items-center justify-between px-4 py-2 bg-white border-b border-gray-100">
    <div class="flex gap-1">
      <button data-filter="all" class="bg-indigo-600 text-white text-xs font-medium px-2.5 py-1 rounded-full">전체</button>
      <button data-filter="me" class="bg-gray-100 text-gray-600 text-xs font-medium px-2.5 py-1 rounded-full">@나</button>
      <button data-filter="unassigned" class="bg-gray-100 text-gray-600 text-xs font-medium px-2.5 py-1 rounded-full">미할당</button>
    </div>
    <div id="mobileTabIndicator" class="flex gap-1"></div>
  </div>

  <!-- Main content -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar (desktop) -->
    <aside class="hidden lg:flex flex-col w-56 bg-white border-r border-gray-200 p-4 shrink-0">
      <div class="mb-4">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">팀 정보</p>
        <p class="text-sm font-bold text-gray-800" id="teamNameSidebar"></p>
        <div class="mt-2 bg-gray-50 rounded-lg px-3 py-2">
          <p class="text-xs text-gray-500 mb-1">초대코드</p>
          <p class="text-sm font-mono font-bold text-indigo-700" id="inviteCodeDisplay"></p>
        </div>
      </div>

      <div class="mb-4">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">팀원</p>
        <div id="membersPanel" class="space-y-1"></div>
      </div>

      <!-- Leave team -->
      <div class="mt-auto space-y-2">
        <button id="leaveTeamBtn" class="w-full text-left text-sm text-gray-500 hover:text-red-600 py-1.5 px-2 rounded hover:bg-red-50 transition-colors">
          팀 떠나기
        </button>
        <button id="logoutBtn" class="w-full text-left text-sm text-gray-500 hover:text-gray-800 py-1.5 px-2 rounded hover:bg-gray-100 transition-colors">
          로그아웃
        </button>
      </div>
    </aside>

    <!-- Mobile Sidebar Overlay -->
    <div id="mobileSidebar" class="lg:hidden fixed inset-0 z-40 hidden">
      <div id="sidebarBackdrop" class="absolute inset-0 bg-black/40"></div>
      <div class="absolute left-0 top-0 h-full w-64 bg-white shadow-xl p-5 flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-gray-800">메뉴</h2>
          <button id="closeSidebarBtn" class="text-gray-400 hover:text-gray-600">✕</button>
        </div>

        <div class="mb-4">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">팀 정보</p>
          <p class="text-sm font-bold text-gray-800" id="teamNameMobile"></p>
          <div class="mt-2 bg-gray-50 rounded-lg px-3 py-2">
            <p class="text-xs text-gray-500 mb-1">초대코드</p>
            <p class="text-sm font-mono font-bold text-indigo-700" id="inviteCodeMobile"></p>
          </div>
        </div>

        <div class="mb-4">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">팀원</p>
          <div id="membersPanelMobile" class="space-y-1"></div>
        </div>

        <div class="mt-auto space-y-2">
          <a href="/chat.html" class="block text-sm text-indigo-600 font-medium py-2 px-2 rounded hover:bg-indigo-50">💬 채팅</a>
          <button id="leaveTeamBtnMobile" class="w-full text-left text-sm text-gray-500 hover:text-red-600 py-2 px-2 rounded hover:bg-red-50">팀 떠나기</button>
          <button id="logoutBtnMobile" class="w-full text-left text-sm text-gray-500 py-2 px-2 rounded hover:bg-gray-100">로그아웃</button>
        </div>
      </div>
    </div>

    <!-- Kanban Board -->
    <main class="flex-1 overflow-x-auto p-4" id="kanbanBoard">
      <div class="flex gap-4 h-full min-h-0" id="columnsContainer">

        <!-- TODO column -->
        <div id="wrapper-TODO" class="kanban-column flex flex-col w-full md:w-72 lg:w-80 shrink-0">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-gray-400"></span>
              <h3 class="font-semibold text-gray-700 text-sm">할 일</h3>
              <span class="task-count text-xs bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded-full font-medium">0</span>
            </div>
            <button id="addTask-TODO" class="text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 p-1 rounded transition-colors" title="태스크 추가">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
            </button>
          </div>
          <div id="col-TODO" class="task-list flex-1 min-h-[200px] rounded-lg p-2 transition-colors space-y-2 overflow-y-auto max-h-[calc(100vh-14rem)]"></div>
        </div>

        <!-- DOING column -->
        <div id="wrapper-DOING" class="kanban-column flex flex-col w-full md:w-72 lg:w-80 shrink-0">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-blue-500"></span>
              <h3 class="font-semibold text-gray-700 text-sm">진행 중</h3>
              <span class="task-count text-xs bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full font-medium">0</span>
            </div>
            <button id="addTask-DOING" class="text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 p-1 rounded transition-colors" title="태스크 추가">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
            </button>
          </div>
          <div id="col-DOING" class="task-list flex-1 min-h-[200px] rounded-lg p-2 transition-colors space-y-2 overflow-y-auto max-h-[calc(100vh-14rem)]"></div>
        </div>

        <!-- DONE column -->
        <div id="wrapper-DONE" class="kanban-column flex flex-col w-full md:w-72 lg:w-80 shrink-0">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-green-500"></span>
              <h3 class="font-semibold text-gray-700 text-sm">완료</h3>
              <span class="task-count text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded-full font-medium">0</span>
            </div>
            <button id="addTask-DONE" class="text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 p-1 rounded transition-colors" title="태스크 추가">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
            </button>
          </div>
          <div id="col-DONE" class="task-list flex-1 min-h-[200px] rounded-lg p-2 transition-colors space-y-2 overflow-y-auto max-h-[calc(100vh-14rem)]"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- Task Detail Modal -->
  <div id="taskModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-lg font-bold text-gray-800">태스크 수정</h3>
        <button id="modalCloseBtn" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">제목</label>
          <input
            type="text"
            id="modalTitle"
            maxlength="100"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">상태</label>
          <select
            id="modalStatus"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="TODO">할 일</option>
            <option value="DOING">진행 중</option>
            <option value="DONE">완료</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">담당자</label>
          <select
            id="modalAssignee"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="">미할당</option>
          </select>
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button
          id="modalDeleteBtn"
          class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2 px-4 rounded-lg transition-colors text-sm"
        >
          삭제
        </button>
        <div class="flex-1"></div>
        <button
          id="modalCloseBtn2"
          class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg transition-colors text-sm"
        >
          취소
        </button>
        <button
          id="modalSaveBtn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors text-sm"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- Owner Leave Confirm Dialog -->
  <div id="ownerLeaveDialog" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">
      <div class="text-4xl mb-3">⚠️</div>
      <h3 class="text-lg font-bold text-gray-800 mb-2">팀장은 바로 탈퇴할 수 없습니다</h3>
      <p class="text-sm text-gray-500 mb-5">팀원에게 팀장을 위임하거나 팀을 삭제하세요.</p>
      <div class="flex flex-col gap-2">
        <button id="transferOwnerBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm">
          팀장 위임
        </button>
        <button id="deleteTeamFromDialogBtn" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm">
          팀 삭제
        </button>
        <button id="cancelLeaveBtn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-lg transition-colors text-sm">
          취소
        </button>
      </div>
    </div>
  </div>

  <!-- Transfer Owner Modal -->
  <div id="transferModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-gray-800">팀장 위임</h3>
        <button id="closeTransferModal" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>
      <p class="text-sm text-gray-500 mb-4">위임할 팀원을 선택하세요</p>
      <div id="transferMemberList" class="space-y-2 max-h-48 overflow-y-auto mb-4"></div>
      <button id="confirmTransferBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm disabled:opacity-50" disabled>
        위임하기
      </button>
    </div>
  </div>

  <script type="module">
    import { initKanban, setupDropZones, setupTaskModal } from './js/kanban.js';
    import auth from './js/auth.js';
    import api from './js/api.js';
    import { showError, showSuccess } from './js/toast.js';

    if (!auth.requireAuth()) {
      // Will redirect
    }

    await initKanban();
    setupDropZones();
    setupTaskModal();

    const user = auth.getUser();

    // Sync team name to sidebar and mobile
    const teamNameEl = document.getElementById('teamName');
    const teamNameSidebar = document.getElementById('teamNameSidebar');
    const teamNameMobile = document.getElementById('teamNameMobile');

    function syncTeamUI() {
      const name = teamNameEl?.textContent || '';
      if (teamNameSidebar) teamNameSidebar.textContent = name;
      if (teamNameMobile) teamNameMobile.textContent = name;

      const code = document.getElementById('inviteCodeDisplay')?.textContent || '';
      const codeMobile = document.getElementById('inviteCodeMobile');
      if (codeMobile) codeMobile.textContent = code;

      // Sync members to mobile panel
      const panel = document.getElementById('membersPanel');
      const mobilePanelTarget = document.getElementById('membersPanelMobile');
      if (panel && mobilePanelTarget) {
        mobilePanelTarget.innerHTML = panel.innerHTML;
      }
    }

    // Wait a tick for kanban to render
    setTimeout(syncTeamUI, 500);

    // Hamburger
    document.getElementById('hamburgerBtn')?.addEventListener('click', () => {
      syncTeamUI();
      document.getElementById('mobileSidebar').classList.remove('hidden');
      document.getElementById('mobileSidebar').classList.add('flex');
    });
    document.getElementById('closeSidebarBtn')?.addEventListener('click', () => {
      document.getElementById('mobileSidebar').classList.add('hidden');
      document.getElementById('mobileSidebar').classList.remove('flex');
    });
    document.getElementById('sidebarBackdrop')?.addEventListener('click', () => {
      document.getElementById('mobileSidebar').classList.add('hidden');
      document.getElementById('mobileSidebar').classList.remove('flex');
    });

    // Modal close btn2
    document.getElementById('modalCloseBtn2')?.addEventListener('click', () => {
      document.getElementById('taskModal').classList.add('hidden');
      document.getElementById('taskModal').classList.remove('flex');
    });

    // Leave team logic
    async function handleLeaveTeam() {
      if (!user || !user.team_id) return;
      try {
        const team = await api.get(`/teams/${user.team_id}`);
        if (team.owner_id === user.id) {
          // Owner — show dialog
          document.getElementById('ownerLeaveDialog').classList.remove('hidden');
          document.getElementById('ownerLeaveDialog').classList.add('flex');
        } else {
          if (!confirm('정말 팀을 떠나시겠습니까?')) return;
          await api.delete(`/teams/${user.team_id}/leave`);
          const u = auth.getUser();
          u.team_id = null;
          auth.setAuth(auth.getToken(), u);
          window.location.href = '/team-select.html';
        }
      } catch (err) {
        showError(err.message);
      }
    }

    document.getElementById('leaveTeamBtn')?.addEventListener('click', handleLeaveTeam);
    document.getElementById('leaveTeamBtnMobile')?.addEventListener('click', handleLeaveTeam);

    // Owner leave dialog buttons
    document.getElementById('cancelLeaveBtn')?.addEventListener('click', () => {
      document.getElementById('ownerLeaveDialog').classList.add('hidden');
      document.getElementById('ownerLeaveDialog').classList.remove('flex');
    });

    document.getElementById('deleteTeamFromDialogBtn')?.addEventListener('click', async () => {
      if (!confirm('팀을 삭제하면 모든 데이터가 영구적으로 삭제됩니다. 정말 삭제하시겠습니까?')) return;
      try {
        await api.delete(`/teams/${user.team_id}`);
        const u = auth.getUser();
        u.team_id = null;
        auth.setAuth(auth.getToken(), u);
        window.location.href = '/team-select.html';
      } catch (err) {
        showError(err.message);
      }
    });

    // Transfer owner modal
    let selectedNewOwnerId = null;

    document.getElementById('transferOwnerBtn')?.addEventListener('click', async () => {
      document.getElementById('ownerLeaveDialog').classList.add('hidden');
      document.getElementById('ownerLeaveDialog').classList.remove('flex');

      // Load members
      try {
        const members = await api.get(`/teams/${user.team_id}/members`);
        const otherMembers = members.filter(m => m.id !== user.id);
        const list = document.getElementById('transferMemberList');
        list.innerHTML = '';
        selectedNewOwnerId = null;
        document.getElementById('confirmTransferBtn').disabled = true;

        otherMembers.forEach(m => {
          const btn = document.createElement('button');
          btn.className = 'w-full flex items-center gap-3 p-3 rounded-lg border-2 border-transparent hover:border-indigo-200 hover:bg-indigo-50 transition-colors text-left';
          btn.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-sm font-bold text-indigo-700">
              ${m.email[0].toUpperCase()}
            </div>
            <span class="text-sm font-medium text-gray-800">${m.email}</span>
          `;
          btn.addEventListener('click', () => {
            list.querySelectorAll('button').forEach(b => b.classList.remove('border-indigo-500', 'bg-indigo-50'));
            btn.classList.add('border-indigo-500', 'bg-indigo-50');
            selectedNewOwnerId = m.id;
            document.getElementById('confirmTransferBtn').disabled = false;
          });
          list.appendChild(btn);
        });

        if (otherMembers.length === 0) {
          list.innerHTML = '<p class="text-sm text-gray-500 text-center py-4">위임할 팀원이 없습니다</p>';
        }

        document.getElementById('transferModal').classList.remove('hidden');
        document.getElementById('transferModal').classList.add('flex');
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById('closeTransferModal')?.addEventListener('click', () => {
      document.getElementById('transferModal').classList.add('hidden');
      document.getElementById('transferModal').classList.remove('flex');
    });

    document.getElementById('confirmTransferBtn')?.addEventListener('click', async () => {
      if (!selectedNewOwnerId) return;
      try {
        await api.patch(`/teams/${user.team_id}/transfer-owner`, { new_owner_id: selectedNewOwnerId });
        // Now leave the team
        await api.delete(`/teams/${user.team_id}/leave`);
        const u = auth.getUser();
        u.team_id = null;
        auth.setAuth(auth.getToken(), u);
        showSuccess('팀장 위임 및 탈퇴가 완료됐습니다');
        setTimeout(() => window.location.href = '/team-select.html', 1000);
      } catch (err) {
        showError(err.message);
      }
    });

    // Logout
    async function handleLogout() {
      try {
        await api.post('/auth/logout', {});
      } catch {}
      auth.clearAuth();
      window.location.href = '/index.html';
    }
    document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);
    document.getElementById('logoutBtnMobile')?.addEventListener('click', handleLogout);
  </script>
</body>
</html>
